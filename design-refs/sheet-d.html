<!doctype html><meta charset="utf-8" /><style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font: 15px/1.35 system-ui;
    padding: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 500px);
    gap: 12px;
  }
  .cell {
    margin: 0;
  }
  .cell img {
    width: 500px;
    height: 330px;
    object-fit: cover;
    border-radius: 8px;
    background: #333;
    display: block;
  }
  figcaption {
    padding: 6px 2px;
    font-size: 16px;
    color: #bcd;
  }
</style>
